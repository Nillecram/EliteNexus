# Push a tag like v0.1.0 (GitHub Desktop: History → right-click a commit → Create Tag, then Push)
# and this builds Elite Nexus for Windows, Linux and macOS and publishes them as a GitHub Release, with that
# version's section of CHANGELOG.md as the release notes. See AGENTS.md › Releases.
# A tag with a hyphen (v0.6.0-beta.1) publishes a pre-release: never marked "Latest", so the website's and README's
# download links (releases/latest) keep the last stable version, and testers get the pre-release's own page.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p nexus-app
      - name: Package
        shell: pwsh
        run: |
          $name = "EliteNexus-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Force -Path "out\$name" | Out-Null
          Copy-Item target\release\EliteNexus.exe, LICENSE, README.md, NOTICE.md, docs\USER_GUIDE.md "out\$name"
          # The bundled Inter font's licence (SIL OFL) travels with the program.
          Copy-Item data\fonts\inter\LICENSE.txt "out\$name\Inter-LICENSE.txt"
          Compress-Archive -Path "out\$name\*" -DestinationPath "out\$name.zip"
          # A checksum file next to the zip, so a download can be checked (Get-FileHash <zip>, or sha256sum -c
          # <file>.sha256). A plain \n line end: with Set-Content's \r\n, sha256sum reads the file name with a \r.
          $hash = (Get-FileHash -Algorithm SHA256 "out\$name.zip").Hash.ToLower()
          [IO.File]::WriteAllText("$PWD\out\$name.zip.sha256", "$hash  $name.zip`n")
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/*.zip
            out/*.zip.sha256

  linux:
    # Ubuntu 22.04's glibc (2.35), so the binary also starts on older distributions and SteamOS.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p nexus-app
      - name: Package
        run: |
          name="EliteNexus-${GITHUB_REF_NAME}-linux-x64"
          mkdir -p "out/$name"
          cp target/release/EliteNexus LICENSE README.md NOTICE.md docs/USER_GUIDE.md "out/$name/"
          cp data/fonts/inter/LICENSE.txt "out/$name/Inter-LICENSE.txt"
          tar -C out -czf "out/$name.tar.gz" "$name"
          # Check a download with: sha256sum -c <file>.sha256
          (cd out && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            out/*.tar.gz
            out/*.tar.gz.sha256

  macos:
    # Apple Silicon. The app is ad-hoc signed, not notarized: a downloaded copy has to be allowed once
    # (System Settings › Privacy & Security › Open Anyway).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and pack
        run: bash tools/macos/build-app.sh
      - name: Package
        run: |
          # build-app.sh names the zip EliteNexus-v<version>-macos-<arch>.zip, as the tag names the release.
          mkdir -p out
          cp target/macos/EliteNexus-*-macos-*.zip out/
          (cd out && for z in *.zip; do shasum -a 256 "$z" > "$z.sha256"; done)
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            out/*.zip
            out/*.zip.sha256

  publish:
    needs: [windows, linux, macos]
    # Windows and Linux must build; a failed macOS build only leaves the Mac zip out of the release.
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SPONSORS_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: |
          # This version's "## [x.y.z]" section of CHANGELOG.md, up to the next "## " heading.
          $version = "${{ github.ref_name }}".TrimStart('v')
          $lines = @(Get-Content CHANGELOG.md)
          $heading = "^## \[$([regex]::Escape($version))\]"
          $notes = @()
          $inside = $false
          foreach ($l in $lines) {
            if ($l -match '^## ') { if ($inside) { break }; $inside = $l -match $heading; continue }
            if (-not $inside) { continue }
            # The file is hard-wrapped, but release pages turn every newline into a line break: join a
            # wrapped line onto the one before unless it starts a list item, a heading or a paragraph.
            $continues = $notes.Count -gt 0 -and $notes[-1].Trim() -and $l.Trim() -and $l -notmatch '^\s*(#|[-*]\s|\d+\.\s)'
            if ($continues) { $notes[-1] = $notes[-1] + ' ' + $l.Trim() } else { $notes += $l }
          }
          if (-not ($notes -join '').Trim()) { $notes = @('See CHANGELOG.md for what changed.') }
          # Then GitHub's own notes (merged pull requests, new contributors, the compare link), generated here: the
          # release action would add them at the very end, under the support buttons. If the API fails, the release
          # goes out without them; the exit code is cleared because Actions fails a pwsh step on the last one.
          $generated = @(gh api "repos/${{ github.repository }}/releases/generate-notes" -f "tag_name=${{ github.ref_name }}" --jq .body)
          if ($LASTEXITCODE -ne 0) { Write-Warning "GitHub's generated notes are left out"; $generated = @(); $global:LASTEXITCODE = 0 }
          if (($generated -join '').Trim()) { $notes += ''; $notes += $generated }
          # Every release page ends with the support buttons: the app is free, sponsoring is optional.
          $notes += ''
          $notes += '---'
          $notes += ''
          $notes += 'Elite Nexus is free, with no ads. If it helps you, you can sponsor it; nothing in the app depends on it.'
          $notes += ''
          $notes += '<a href="https://github.com/sponsors/uruskan"><img src="https://img.shields.io/badge/Sponsor-%E2%9D%A4-ea4aaa?style=for-the-badge&logo=githubsponsors&logoColor=white" alt="Sponsor on GitHub"></a> <a href="https://buymeacoffee.com/uruskan"><img src="https://img.shields.io/badge/Buy%20me%20a%20coffee-%E2%98%95-ffdd00?style=for-the-badge&logo=buymeacoffee&logoColor=black" alt="Buy me a coffee"></a>'
          # Under them, the supporters, first and apart with larger avatars: the public GitHub sponsors (private
          # ones never; the first 100), read with the SPONSORS_TOKEN secret if there is one, else this run's token,
          # then the README's Thanks section under its "**Sponsors**" line, where supporters from elsewhere (Buy Me
          # a Coffee) are added by hand: a GitHub profile link brings an avatar, an item starting with a bold name
          # and no link is thanked by name. Then everyone else Thanks links to a GitHub profile (code, bug reports
          # and ideas), in its order.
          $sponsors = @()
          try {
            $token = if ($env:SPONSORS_TOKEN) { $env:SPONSORS_TOKEN } else { $env:GH_TOKEN }
            $query = 'query { user(login: "uruskan") { sponsorshipsAsMaintainer(first: 100, activeOnly: false, includePrivate: false, orderBy: {field: CREATED_AT, direction: ASC}) { nodes { sponsorEntity { ... on User { login } ... on Organization { login } } } } } }'
            $r = Invoke-RestMethod -Method Post -Uri 'https://api.github.com/graphql' -Headers @{ Authorization = "bearer $token" } -ContentType 'application/json' -Body (@{ query = $query } | ConvertTo-Json)
            if ($r.errors) { throw (($r.errors | ForEach-Object { $_.message }) -join ' ') }
            $sponsors = @($r.data.user.sponsorshipsAsMaintainer.nodes | ForEach-Object { $_.sponsorEntity.login } | Where-Object { $_ })
          } catch { Write-Warning "GitHub sponsors couldn't be read, so only the README's are listed: $_" }
          $named = @()
          $others = @()
          $group = ''
          $inThanks = $false
          foreach ($l in Get-Content README.md) {
            if ($l -match '^## ') { if ($inThanks) { break }; $inThanks = $l -match '^## Thanks'; continue }
            if (-not $inThanks) { continue }
            if ($l -match '^\*\*([^*\[]+)\*\*\s*$') { $group = $Matches[1]; continue }
            $logins = @([regex]::Matches($l, '\]\(https://github\.com/([A-Za-z0-9-]+)\)') | ForEach-Object { $_.Groups[1].Value })
            if ($group -like 'Sponsor*') {
              $sponsors += $logins
              if ($l -match '^\s*[-*]\s+\*\*([^*\[\]]+)\*\*') { $named += $Matches[1] }
            } else { $others += $logins }
          }
          # Each name once (logins ignore case), and a sponsor only among the sponsors.
          $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          $sponsors = @($sponsors | Where-Object { $seen.Add($_) })
          $named = @($named | Where-Object { $seen.Add($_) })
          $others = @($others | Where-Object { $seen.Add($_) })
          $avatar = '<a href="https://github.com/{0}"><img src="https://avatars.githubusercontent.com/{0}?s={1}" width="{2}" height="{2}" alt="{0}" title="{0}"></a>'
          if ($sponsors -or $named) {
            $names = @($sponsors | ForEach-Object { '[{0}](https://github.com/{0})' -f $_ }) + $named
            $notes += ''
            $notes += "**Elite Nexus is possible because of its supporters**: thank you, $($names -join ', '), and everyone who sponsors anonymously or bought a coffee!"
            if ($sponsors) { $notes += ''; $notes += ($sponsors | ForEach-Object { $avatar -f $_, 128, 64 }) -join ' ' }
          }
          if ($others) {
            $notes += ''
            $notes += 'Thanks also to these commanders for code, bug reports and ideas, and to many more on the Frontier Forums ([who did what](https://github.com/uruskan/EliteNexus#thanks)):'
            $notes += ''
            $notes += ($others | ForEach-Object { $avatar -f $_, 80, 40 }) -join ' '
          }
          $notes | Set-Content out/notes.md -Encoding utf8NoBOM
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.zip
            out/*.zip.sha256
            out/*.tar.gz
            out/*.tar.gz.sha256
          body_path: out/notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
