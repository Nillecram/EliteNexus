[package]
name = "nexus-app"
description = "Elite Nexus desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "EliteNexus"
path = "src/main.rs"

[dependencies]
nexus-journal.workspace = true
nexus-data.workspace = true
nexus-model.workspace = true
nexus-binds.workspace = true
nexus-spansh.workspace = true
nexus-uplink.workspace = true
nexus-galaxy.workspace = true
nexus-eddn.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
egui_plot.workspace = true
egui-phosphor.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
arboard.workspace = true
flate2.workspace = true
base64.workspace = true
tts.workspace = true
image.workspace = true
rustc-hash.workspace = true
tokio.workspace = true
reqwest.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"
