[package]
name = "nexus-spansh"
description = "Spansh API client: route plotters and galaxy search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
reqwest.workspace = true
# CancellationToken for route jobs (re-exported as `nexus_spansh::CancellationToken`).
tokio-util = { version = "0.7", default-features = false }
# Field paths in decode errors ("result.jumps[3].fuel_used: invalid type ...").
serde_path_to_error = "0.1"

[dev-dependencies]
anyhow.workspace = true
tokio = { workspace = true }
